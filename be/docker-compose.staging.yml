services:
  postgres:
    image: postgres:16-alpine
    container_name: flowdex-postgres-staging
    environment:
      POSTGRES_DB: flowdex_staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - flowdex_postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowdex_staging"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flowdex-redis-staging
    ports:
      - "6380:6379"
    volumes:
      - flowdex_redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flowdex_postgres_staging_data:
  flowdex_redis_staging_data:
