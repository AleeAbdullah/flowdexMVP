services:
  postgres:
    image: postgres:16-alpine
    container_name: flowdex-postgres
    environment:
      POSTGRES_DB: flowdex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - flowdex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowdex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flowdex-redis
    ports:
      - "6379:6379"
    volumes:
      - flowdex_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flowdex_postgres_data:
  flowdex_redis_data:
